name: Update profile cards

on:
  # 每小时自动刷新（cron 用 UTC）。刻意错开整点：GitHub 在整点前后负载最高，容易被延迟
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 下载中文字体
        run: |
          mkdir -p fonts
          base="https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC"
          curl -fsSL -o fonts/NotoSansSC-Bold.otf "$base/NotoSansSC-Bold.otf"
          curl -fsSL -o fonts/NotoSansSC-Regular.otf "$base/NotoSansSC-Regular.otf"

      - name: 生成名片
        env:
          SKLAND_TOKEN: ${{ secrets.SKLAND_TOKEN }}
        run: python scripts/main.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "名片无变化，跳过提交"
          else
            # 递增 README 里图片链接的 ?v=，让 GitHub 图片 CDN（camo）重新取图；
            # 只在内容变化时递增，避免每次运行都产生无意义的提交
            current=$(grep -oE 'arknights-card\.png\?v=[0-9]+' README.md | grep -oE '[0-9]+$' || true)
            next=$(( ${current:-0} + 1 ))
            sed -i -E "s#(assets/(arknights|endfield)-card\.png)(\?v=[0-9]+)?#\1?v=${next}#g" README.md
            git add README.md
            git commit -m "chore: update profile cards"
            git push
          fi